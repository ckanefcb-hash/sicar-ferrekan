<title>Cotizaciones vs Ventas - Ferrekan</title>
<style>
:root{--bg:#0f1117;--s1:#1a1f2e;--s2:#222635;--brd:#2e3347;--text:#e2e8f0;--muted:#64748b;--acc:#00d4aa;--warn:#ffd166;--danger:#ef4444;--ok:#22c55e;--purple:#a855f7}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'IBM Plex Sans',Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
header{background:var(--s1);border-bottom:1px solid var(--brd);padding:14px 24px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
h1{font-size:16px;font-weight:700}
.sub{font-size:11px;color:var(--muted);margin-top:2px}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
select,input[type=date],input[type=text],input[type=password]{background:var(--s1);border:1px solid var(--brd);color:var(--text);padding:6px 10px;border-radius:6px;font-size:13px;font-family:inherit}
input[type=text]{width:220px}
.btn{background:var(--acc);border:none;color:#000;padding:7px 16px;border-radius:6px;font-size:13px;font-weight:700;cursor:pointer}
.lnk{color:var(--acc);text-decoration:none;font-size:12px;border:1px solid var(--brd);padding:6px 12px;border-radius:6px}
.kpis{display:flex;gap:16px;flex-wrap:wrap;padding:16px 24px}
.kpi{background:var(--s1);border:1px solid var(--brd);border-radius:8px;padding:12px 18px;min-width:160px}
.kpi .val{font-size:22px;font-weight:700;font-family:monospace}
.kpi .lbl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-top:2px}
.kpi .cmp{font-size:11px;color:var(--muted);margin-top:3px;font-family:monospace}
.toolbar{padding:12px 24px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;border-bottom:1px solid var(--brd)}
.tab{padding:6px 14px;border:1px solid var(--brd);border-radius:6px;background:transparent;color:var(--muted);cursor:pointer;font-size:12px;font-family:inherit}
.tab.on{border-color:var(--acc);color:var(--acc);background:rgba(0,212,170,.08)}
.tbl-wrap{padding:0 24px 24px;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
thead th{background:var(--s2);padding:8px 10px;text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);position:sticky;top:0;cursor:pointer;user-select:none;white-space:nowrap}
tbody tr{border-bottom:1px solid var(--brd)}
tbody tr:hover{background:var(--s2)}
td{padding:8px 10px;vertical-align:middle}
.clave{font-family:monospace;font-size:11px;color:var(--acc);white-space:nowrap}
.badge{font-size:10px;padding:1px 6px;border-radius:4px;display:inline-block}
.bdep{background:var(--s2);border:1px solid var(--brd);color:var(--muted)}
.bcat{background:#a855f711;border:1px solid #a855f733;color:#a855f7}
.tnum{text-align:right;font-family:monospace}
.b0{background:#ef444422;color:#ef4444;font-size:10px;padding:2px 7px;border-radius:4px;font-weight:700}
.b1{background:#ffd16622;color:#ffd166;font-size:10px;padding:2px 7px;border-radius:4px;font-weight:700}
.b2{background:#22c55e22;color:#22c55e;font-size:10px;padding:2px 7px;border-radius:4px;font-weight:700}
.note{padding:8px 24px;font-size:11px;color:var(--muted)}
#login{position:fixed;inset:0;background:var(--bg);z-index:999;display:flex;align-items:center;justify-content:center}
#login .box{background:var(--s1);border:1px solid var(--brd);border-radius:12px;padding:28px;width:300px;display:flex;flex-direction:column;gap:10px}
#login .err{color:var(--danger);font-size:12px;display:none}
</style>
</head>

  if(HAS_CMP){cols.push(['cot_ant','Cot. per. ant.']);cols.push(['delta','\u0394 cot.']);}
  var h='', i;
  for(i=0;i<cols.length;i++) h+='<th onclick="sortBy(\''+cols[i][0]+'\')">'+cols[i][1]+' \u21c5</th>';
  document.getElementById('thead').innerHTML=h;
}
function setFilter(f,el){
  currentFilter=f;
  var t=document.querySelectorAll('.tab'), i;
  for(i=0;i<t.length;i++) t[i].classList.remove('on');
  el.classList.add('on');
  render();
}
function sortBy(c){if(sortCol===c) sortAsc=!sortAsc; else {sortCol=c; sortAsc=false;} render();}

function render(){
  var q=document.getElementById('buscar').value.toLowerCase();
  var dep=document.getElementById('selDepto').value, cat=document.getElementById('selCat').value, prv=document.getElementById('selProv').value;
  var rows=ROWS.filter(function(d){
    if(q && d.clave.toLowerCase().indexOf(q)<0 && d.desc.toLowerCase().indexOf(q)<0) return false;
    if(dep && d.depto!==dep) return false;
    if(cat && d.cat!==cat) return false;
    if(prv && d.proveedor!==prv) return false;
    if(currentFilter==='zero') return d.veces_vend===0;
    if(currentFilter==='low') return d.veces_vend>0 && d.tasa<30;
    if(currentFilter==='ok') return d.tasa>=30;
    return true;
  });
  rows.sort(function(a,b){
    var va=a[sortCol], vb=b[sortCol];
    if(va===undefined) va=0; if(vb===undefined) vb=0;
    if(typeof va==='string') return sortAsc?va.localeCompare(vb):vb.localeCompare(va);
    return sortAsc?va-vb:vb-va;
  });
  var shown=rows.slice(0,MAXROWS), html='', i;
  for(i=0;i<shown.length;i++){
    var d=shown[i];
    var bc=d.tasa>=50?'#22c55e':(d.tasa>=20?'#ffd166':'#ef4444');
    var badge=d.veces_vend===0?'<span class="b0">Sin venta</span>':(d.tasa<30?'<span class="b1">'+d.tasa+'%</span>':'<span class="b2">'+d.tasa+'%</span>');
    html+='<tr><td class="clave">'+esc(d.clave)+'</td><td>'+esc(d.desc)+'</td>';
    html+='<td><span class="badge bdep">'+esc(d.depto)+'</span></td><td><span class="badge bcat">'+esc(d.cat)+'</span></td>';
    html+='<td style="font-size:11px;color:var(--muted)">'+esc(d.proveedor)+'</td>';
    html+='<td class="tnum" style="color:var(--warn)">'+d.veces_cot+'</td>';
    html+='<td class="tnum" style="color:var(--muted)">'+d.cant_cot.toLocaleString('es-MX')+'</td>';
    html+='<td class="tnum" style="color:var(--ok)">'+d.veces_vend+'</td>';
    html+='<td class="tnum" style="color:var(--muted)">'+d.cant_vend.toLocaleString('es-MX')+'</td>';
    html+='<td style="text-align:center">'+badge+'<div style="width:70px;height:5px;background:var(--s2);border-radius:3px;margin:3px auto 0"><div style="width:'+d.tasa+'%;height:100%;background:'+bc+';border-radius:3px"></div></div></td>';
    html+='<td class="tnum" style="color:'+(d.oportunidad>0?'var(--purple)':'var(--muted)')+'">'+(d.oportunidad>0?money(d.oportunidad):'-')+'</td>';
    if(HAS_CMP){
      var dl=d.delta, col=dl>0?'var(--ok)':(dl<0?'var(--danger)':'var(--muted)');
      html+='<td class="tnum" style="color:var(--muted)">'+d.cot_ant+'</td>';
      html+='<td class="tnum" style="color:'+col+';font-weight:700">'+(dl>0?'+':'')+dl+'</td>';
    }
    html+='</tr>';
  }
  var span=HAS_CMP?13:11;
  document.getElementById('tbody').innerHTML=html||'<tr><td colspan="'+span+'" style="text-align:center;color:var(--muted);padding:40px">Sin resultados</td></tr>';
  document.getElementById('note').textContent='Mostrando '+shown.length.toLocaleString('es-MX')+' de '+rows.length.toLocaleString('es-MX')+' art\u00edculos'+(rows.length>MAXROWS?' (afina los filtros para ver el resto)':'');
}

function doLogin(){
  var u=document.getElementById('lUser').value.trim().toLowerCase();
  var p=document.getElementById('lPass').value.trim();
  if(USERS[u]&&USERS[u]===p){
    document.getElementById('login').style.display='none';
    try{sessionStorage.setItem('cot_ok','1');}catch(e){}
    init();
  } else {document.getElementById('lErr').style.display='block';}
}
function init(){
  var r=presetRange('mes'), t=fmt(new Date());
  document.getElementById('fIni').value=addDays(t,-89);
  document.getElementById('fFin').value=t;
  cargar();
}
document.getElementById('lPass').addEventListener('keydown',function(e){if(e.key==='Enter') doLogin();});
document.getElementById('lnkPed').href=(location.protocol==='file:')?'Pedidos_SICAR.html':'./';
try{ if(sessionStorage.getItem('cot_ok')==='1'){document.getElementById('login').style.display='none'; init();} }catch(e){}
</script>
